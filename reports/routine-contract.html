<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Routine Contract Check</title>
<style>
:root { --ok:#16a34a; --warn:#f59e0b; --bad:#dc2626; --info:#2563eb; }
* { box-sizing: border-box; }
body { font-family: system-ui, -apple-system, sans-serif; line-height: 1.6; margin: 0; padding: 2rem; color: #1f2937; }
.wrap { max-width: 1080px; margin: 0 auto; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; margin: 1.5rem 0; }
.stat { background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 8px; padding: 1rem; text-align: center; }
.stat .n { font-size: 2rem; font-weight: 700; display: block; }
.stat .l { font-size: 0.875rem; color: #6b7280; }
.n-ok { color: var(--ok); } .n-warn { color: var(--warn); }
.n-bad { color: var(--bad); } .n-info { color: var(--info); }
.card { border-left: 4px solid var(--info); padding: 1rem 1.25rem; margin: 1rem 0; background: #f9fafb; border-radius: 0 8px 8px 0; }
.card.ok { border-color: var(--ok); }
.card.warn { border-color: var(--warn); }
.card.bad { border-color: var(--bad); }
.card.info { border-color: var(--info); }
.why { margin-top: 0.5rem; padding-left: 0.75rem; border-left: 2px solid currentColor; color: #4b5563; }
.tag { display: inline-block; padding: 0.125rem 0.5rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 600; }
.t-hold { background: #dcfce7; color: #166534; }
.t-drift { background: #fef3c7; color: #92400e; }
.t-bad { background: #fee2e2; color: #991b1b; }
.t-info { background: #dbeafe; color: #1e40af; }
.meta { margin-top: 2rem; padding-top: 1rem; border-top: 1px solid #e5e7eb; font-size: 0.875rem; color: #6b7280; }
table { width: 100%; border-collapse: collapse; margin: 1rem 0; }
th, td { border: 1px solid #e5e7eb; padding: 0.75rem; text-align: left; }
th { background: #f9fafb; }
details { margin: 1rem 0; }
summary { cursor: pointer; font-weight: 600; }
</style>
</head>
<body>
<div class="wrap">
<h1>Routine Contract Check</h1>


<div class="grid">
  <div class="stat"><span class="n n-ok">0</span><span class="l">Passed</span></div>
  <div class="stat"><span class="n n-warn">0</span><span class="l">Warnings</span></div>
  <div class="stat"><span class="n n-bad">0</span><span class="l">Failed</span></div>
  <div class="stat"><span class="n n-info">0</span><span class="l">Info</span></div>
</div>
