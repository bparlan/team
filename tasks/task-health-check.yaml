id: health-check
name: Health Check
type: monitoring
priority: 10
description: Run project health checks and system diagnostics
failure_handling: retry
context:
  - Project root structure
  - Runtime configuration
  - Required files and directories
expected_output: "Health check passed: /path/to/root"
phases:
  - name: execute
    script: scripts/loop_health_check.py
    args: []
    timeout_seconds: 300
# The prompt is the whole task document, verbatim. An agent receives this
# text; anything lost here is a task the user can no longer run.
prompt: |-
  # Task: health-check
  ## Type
  monitoring
  ## Priority
  10
  ## Description
  Run project health checks and system diagnostics
  ## Execution
  python3 scripts/loop_health_check.py
  ## Context
  - Project root structure
  - Runtime configuration
  - Required files and directories
  ## Expected Output
  Health check passed: /path/to/root
  ## Failure Handling
  retry
