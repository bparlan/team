# Project Convention Infrastructure -- implementation plan
#
# One of five plans in this directory. The others are
# human-report-surface.yaml, system-awareness-injection.yaml and
# diagram-citation-truth.yaml. All five live here because AGENTS.md:39-40 bans
# `*_PLAN.md`, `*_ANALYSIS.md` and `*_REPORT.md`.
#
# NOTE: folder-monitoring.yaml also sits in this directory but is NOT the same
# shape. It is a `type: loop` registered task -- schedule, outputs, actions,
# script-only phases -- the tasks/*.yaml contract. These five are roadmap
# plans: status, phases with contract/steps/done_when/rollback, no schedule.
# Cite a sibling plan as precedent, not folder-monitoring.
#
# The body is emitted by yaml.safe_dump from a dict, not hand-indented.
# Hand-written YAML failed to parse three times in one session -- an unquoted
# ": " inside a folded scalar is enough -- so only the prose in this header is
# hand-written.
#
# Status: not-started. The example-project gate was removed; the seed structure
# from scripts/seed_project.py is the baseline. The checker evaluates any
# project root against its own seed.yaml.
# Revised: 2026-10-05 -- q0-name-the-example removed; seed-shape-as-baseline
# decision replaces one-example-not-a-fleet.
# Authored: 2026-10-04.

id: project-convention-infra
name: Project Convention Infrastructure
status: not-started
priority: 4
depends_on: []
intent: 'A project convention is only real if something checks it. This plan builds the checker
  side: given one project, establish which conventions it holds, which it claims to hold but
  does not, and turn the second set into a task that fails.'
why_this_shape: 'The originating session found the same defect class four times in one repo:
  AGENTS.md named a file that had moved to archive/; ONBOARDING.md declared markdown-in-reports/
  a defect while 8 such files existed; a docstring cited a fact its own test disproved; and
  a rule was documented alongside a test that could not fail. Every one is a claim-vs-reality
  gap, and every one is mechanically checkable. That is a reusable capability, not a team-specific
  annoyance.'
explicitly_out_of_scope:
- 'Scanning every project under ~/devcode. The user excluded this: only a handful of projects
  are relevant and the user will name them. A fleet-wide census is a different, larger piece
  of work and is not started here.'
- A ROADMAP.md index. Real need, acknowledged separately; it is a content question about this
  repo, not a convention-checking capability.
- Rewriting any project's existing documentation. This plan produces a checker and a report.
  Edits are the owning project's decision.
decisions:
- id: seed-shape-as-baseline
  question: What is the convention shape to check against?
  answer: 'The seed structure from scripts/seed_project.py: REQUIRED_DIRS (docs, scripts,
    src, tests), OPTIONAL_DIRS (data), REQUIRED_FILES (AGENTS.md, README.md). The seed
    is project-agnostic by design -- it was derived from three construction projects
    and stripped of all project-specific references. Every project supplies its own
    seed.yaml; the checker reads it from the project root.'
  decided_by: user
- id: conventions-not-documentation
  question: Is this an architecture for writing documentation, or for checking it?
  answer: 'Checking. Prose quality is a judgement call and belongs to doc-truth, which already
    audits human-facing docs. What is missing everywhere is the mechanical layer: does the
    file AGENTS.md names exist; does the rule ONBOARDING.md states hold on disk. Same shape
    as task-contract and prompt-truth, generalised from this repo to any project.'
  decided_by: analysis
- id: rules-in-a-data-file
  question: Do the checked conventions live in the script, or in a per-project file?
  answer: 'In a per-project data file the script reads. B1. The script carries the mechanism
    and the project supplies its rules, which is what makes "one script, not one per project"
    achievable. Baking the rules in (B2) would be a much smaller plan, but a convention only
    one project holds would fire false findings everywhere else, so the script would stop
    being project-agnostic and p2''s contract would be unachievable as written.'
  decided_by: user
phases:
- id: p0-baseline
  name: Inventory this repo against the seed shape
  depends_on: []
  estimated_effort: 30 min
  rationale: Read before writing. The failure mode is inventing a taxonomy and then finding
    the project already had one under another name.
  steps:
  - Run scripts/seed_project.py --verify-only against this repo root. Record which
    seed shape elements exist and which are absent.
  - Inventory convention files (AGENTS.md, README.md, docs/, scripts/, src/, tests/,
    data/), and what each claims.
  - For every claim naming a file, path, count or command, test it the way prompt-truth
    does, and require the referent to exist.
  - Record what is ABSENT as carefully as what is present.
  done_when: 'DONE. Basis: seed_project.py defines the shape (REQUIRED_DIRS, REQUIRED_FILES)
    and verify_seed confirms compliance. This repo is the subject -- it has git history
    and real code paths. The inventory is recorded as this project''s seed.yaml, not as
    a separate document.'
  rollback: Read-only; nothing changed.
  status: not-started
- id: p1-derive-the-set
  name: Decide which conventions are worth checking
  depends_on: p0-baseline
  estimated_effort: 1 hour
  rationale: 'A convention nobody violates needs no checker, and a checker that fires once
    gets disabled. The bar is: mechanical, and violated often enough to matter.'
  contract:
  - Every candidate convention must be mechanically decidable. 'The docs are clear' is not
    a candidate; 'AGENTS.md names only files that exist' is.
  - Each must name the failure it prevents. A check that prevents nothing is noise with a
    maintenance cost.
  - Anything requiring interpretation is excluded and named as belonging to doc-truth.
  done_when: 'DONE. Basis: the derived set is the directory shape (required: docs, scripts,
    src, tests; optional: data) plus the two convention files (AGENTS.md, README.md). It is
    emitted as seed.yaml by scripts/seed_project.py, which has been run and verified against
    a scratch directory. docs/skeletons/ is deliberately excluded: it is a capability of the
    code-search skill, not a directory the seed creates.'
  rollback: Nothing built.
  status: not-started
- id: p2-build-the-checker
  name: One script that runs in any project
  depends_on: p1-derive-the-set
  estimated_effort: half a day
  rationale: One script, not one per project. That is the whole difference between a capability
    and a chore.
  contract:
  - Takes a project root as an argument; reads seed.yaml from that root, hardcodes nothing.
  - Exits 0 with findings, like task-contract and prompt-truth. A convention checker that
    fails closed is one that gets switched off.
  - Every check ships with a mutation test proving it fires AND a test proving a real compliant
    shape stays clean. The second half is what stops the checker crying wolf -- the failure
    that actually happened twice in the originating session.
  done_when: 'PARTIAL. scripts/seed_project.py --verify-only checks the shape a seed establishes:
    the two files and the four required directories. What is NOT built is the other half --
    a checker that reads a project EXISTING conventions and reports whether it holds the ones
    it claims. verify_seed confirms scaffolding; it cannot tell a project with real AGENTS.md
    content from a stub. That checker is the remaining work.'
  rollback: Delete the script and its tests.
  status: partial
- id: p3-decide-placement
  name: Decide where this lives
  depends_on: p2-build-the-checker
  estimated_effort: decision, not engineering
  options:
  - Extend theteam as another task (check-conventions), consistent with task-contract and
    prompt-truth. Cheapest; one registry to maintain.
  - A separate package that theteam can invoke. Right if it must apply to projects that do
    not use theteam at all; wrong if it only ever serves theteam's own ecosystem.
  done_when: 'One option chosen and recorded here with its reason. Deliberately left as a
    decision: choosing before p2 exists would be guessing at the shape.'
verification:
- command: python -m pytest -q
  expect: at least 810 passed, zero failures
- command: bash scripts/check_invariants.sh
  expect: invariant gate PASSED
- command: python3 scripts/check_task_contract.py .
  expect: zero findings -- new work must not break the existing checkers
- command: python3 scripts/seed_project.py --project-root .
  expect: this repo is compliant with the seed shape, or names the missing items
- command: python3 scripts/seed_project.py --project-root <synthetic-dir> --verify-only
  expect: exits 1 and names the missing items for a project with no seed shape
open_questions_for_user:
- Should this ship as a theteam task or a standalone package? Revisit at p3, once the checker
  exists and its shape is known.
notes_for_implementer:
- 'Four of nine errors in the originating session were false claims about files the author
  had not opened. Three were caught by the user, one by a mutation test. The cheapest guard
  is unchanged: verify a factual claim in the same breath you write it, or mark it [UNVERIFIED].'
- A checker that reports working code as broken gets tuned out and then catches nothing. Both
  halves of that -- fires on violation, silent on compliance -- are tests, not intentions.
- Do not start this plan before human-report-surface lands. The boundary rule it establishes
  is the vocabulary p1 needs, and building both at once means debugging two unfamiliar things
  at the same time.
- The seed shape is the baseline, not a named example project. scripts/seed_project.py
  already defines REQUIRED_DIRS, OPTIONAL_DIRS, and REQUIRED_FILES. The checker reads
  seed.yaml from the project root; it hardcodes nothing about this repo.
status_meaning: 'not-started (ready to execute). The seed structure from scripts/seed_project.py
  is the baseline; this repo is the first subject. The checker half -- the script that decides
  whether a project HOLDS the conventions it claims, rather than scaffolding them -- is not
  built. These files are roadmap artifacts, not registered tasks, so this vocabulary is local
  to them and unrelated to theteam run statuses (ok / failed / skipped / awaiting). Legal
  values: not-started (ready to execute), in-progress (partially built), awaiting-input
  (cannot begin without a user decision), blocked-on-defect (cannot begin until an external
  fix lands). Add any new value here first.'
shared_constraints:
- Rules live in a per-project data file (B1), never inside the script. The script carries
  the mechanism; the project supplies its rules. Every checker built in the originating session
  hardcoded something -- a path, a filename, an exit code -- and that is the exact failure
  this constraint exists to stop. Adding a convention to a project must never require editing
  the script.
- Report, never gate. Exits 0 with findings, like task-contract and prompt-truth. A checker
  that fails closed on a false finding gets switched off, and a switched-off checker catches
  nothing.
- Prove both halves. Every check ships with a mutation test proving it fires AND a test proving
  a real compliant shape stays clean. The second half is what stops it crying wolf.
- Report the checked/not-checkable split, never a bare total. "12 conventions checked" while
  saying nothing about the ones it could not evaluate is a false all-clear.
risks:
- - Deriving from one project yields a taxonomy that fits that project.
  - 'Mitigation: every rule is stated as a shape ("AGENTS.md names only files that exist")
    rather than as a finding about one repo. A rule that could only apply to the example is
    a coincidence, not a convention.'
- - The checker drifts back toward hardcoding, which is the path of least resistance when
    a new project needs one more rule.
  - 'Mitigation: the data-file constraint above, plus p2''s mutation test proving the script
    passes on a synthetic project sharing no filenames with the example.'
- - A project holds every seed shape element and has zero claimed-but-unheld conventions;
    the checker produces an empty finding list.
  - Accepted. An empty list is a valid and informative outcome -- it means the project's
    conventions match its stated shape. An hour spent confirming that is a cheap answer.
