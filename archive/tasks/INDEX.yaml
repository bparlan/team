# Forward Work Index
#
# The entry point for archive/tasks/. Start here, then open the plan file.
#
# The body is emitted by yaml.safe_dump from a dict, not hand-indented.
# Hand-written YAML failed to parse three times in one session -- an unquoted
# ": " inside a folded scalar is enough -- so only the prose in this header is
# hand-written.
#
# Status: not-started. Authored: 2026-10-04.

id: forward-work
name: Forward Work Index
status: not-started
status_meaning: 'Roadmap artifacts, not registered tasks, so this vocabulary is local and
  unrelated to theteam''s run statuses (ok / failed / skipped / awaiting). Legal values:
  not-started (ready to execute), awaiting-input (cannot begin without a user decision),
  blocked-on-defect (cannot begin until an external fix lands). Add any new value here first.'
purpose: 'One index over the plans in this directory: what exists, what order it can run
  in, and what each one is waiting on. AGENTS.md:39-40 bans a planning markdown file, and
  it names STABILITY_ROADMAP.md as the single source of truth while that file lives in archive/
  -- this index is the working answer to that contradiction, not a replacement for a project-wide
  roadmap.'
plans:
- file: human-report-surface.yaml
  id: human-report-surface
  status: done
  one_line: reports/ is HTML; .omp/ and reports/.handoff/ hold machine artifacts. All phases complete.
  phases: 5
  blocked_on: null
  depends_on_plans: []
- file: project-convention-infra.yaml
  id: project-convention-infra
  status: done
  one_line: Given any project root, inventory it against the seed shape and build a
    checker that reports claim-vs-reality gaps.
  phases: 5
  blocked_on: null
  depends_on_plans:
  - human-report-surface
  note: Seed shape from scripts/seed_project.py is the baseline; no named example
    project needed. p0 inventories this repo against the seed, p1 derives the set,
    p2 builds the checker, p3 decides placement.
- file: system-awareness-injection.yaml
  id: system-awareness-injection
  status: done
  one_line: 'Give theteam the ability to see what it can do right now, and give agents a
    self-evaluating rule-shape they can extend without a human. The shape was derived from
    real projects at authoring time and the derivation inputs were then removed: the plan
    names no project and depends on none.'
  phases: 5
  blocked_on: null
  depends_on_plans:
  - human-report-surface
  note: No phase waits on user input. The audit that produced the shape found ZERO wrong
    rules -- what it found is right rules with no mechanical backing, so the shape records
    TWO INDEPENDENT axes (is the rule right / can a checker decide it) rather than one disposition
    column. The seed lets an agent self-evaluate; an evolution floor stops it weakening
    or deleting rules without a human.
- file: diagram-citation-truth.yaml
  id: diagram-citation-truth
  status: done
  phases: 5
  blocked_on: null
  one_line: Nine diagram citations were never right, not stale. Correct the 9 numbers, then
    teach scripts/update_team_check.py to resolve symbols so they cannot come back.
- file: document-citation-truth.yaml
  id: document-citation-truth
  status: done
  phases: 5
  blocked_on: null
  one_line: No checker reads ARCHITECTURE.md, README.md, SKILL.md or CLI.md. They carry
    389 path-shaped citations, 12 of them line-cited and mechanically checkable. Close the
    12, and report the other 360 as not checkable plus 17 skipped by rule, rather than implying
    coverage.
recommended_order:
- 1. human-report-surface p2 -- move the 8 markdown files already committed into the human
  surface to reports/.handoff/. Fifteen minutes, no decisions outstanding, and it makes
  a rule the repo already states true today.
- 2. diagram-citation-truth p0-p1 -- add the symbol checker, then correct the 9 lines. Independent
  of everything else here, mechanical, and the only finding where a reader tracing the architecture
  today lands on the wrong line.
- 3. document-citation-truth p0-p2 -- the measurement, the package-relative resolution,
  and the two rules that can hard-fail because all 12 checkable claims pass today. p0 asserts
  its own counts, so parser drift surfaces as a failure rather than a slow rot.
- 4. diagram-citation-truth p2-p3 -- extend the existing anchor gate to resolve symbols,
  and move its in-loop return so all three diagrams are checked. Makes the gate able to
  see the defect it currently waves through.
- 5. document-citation-truth p3-p4 -- symbol resolution, then gate wiring. This is the tier
  that catches a citation pointing at the wrong line rather than a missing file, and it
  starts report-only because it is the newest and least proven rule.
- 6. human-report-surface in full -- the html renderer, the boundary check, the skill-copy
  drift test. Establishes the vocabulary the other plans reuse.
- '7. system-awareness-injection p0 -- audit capability claims. One hour, read-only, needs
  no example project, and it verifies its own premise: if no false claims exist, the plan
  is void and the hour was cheap.'
- 8. project-convention-infra -- DONE. Seed shape as baseline, checker built.
why_this_order: Cost of being wrong, ascending, and cost of being unable to undo it, descending.
  Step 1 is fifteen minutes, needs no decision, and cannot be wrong. Step 2 corrects nine
  line numbers that are wrong today, so a reader tracing the architecture today lands on
  the wrong line -- it is the only step that fixes a defect a person is currently hitting,
  and it ships alone without waiting for anything. Step 3 adds a checker whose first run
  is green by construction, because all 12 claims it can check currently pass; it goes before
  step 5 so that when symbol resolution later turns the checker red, there is a known-good
  baseline to compare against. Step 4 makes the diagram gate stricter, which turns a green
  gate red on a tree that was previously wrong, so it must follow step 2. Step 5 is the
  newest and least proven rule in the set and starts report-only; putting it after the measured
  phases is what keeps 'report, do not gate' credible. Step 6 is the largest build and introduces
  a new public surface. Step 7 is read-only and can only return 'your premise is false',
  which is a useful answer for an hour. Step 8 is blocked on a decision only the user can
  make, so it is last and stays blocked rather than being started on a guess. Running the
  cheap, irreversible, currently-broken things first is the whole argument.
not_planned:
- 'A project-wide ROADMAP.md index. Acknowledged as a real need by the user and deliberately
  not built here: it is a content decision about what a roadmap is for, and this index does
  not presume to answer it.'
- A fleet-wide convention census across ~/devcode. Excluded by the user; only a handful
  of projects are relevant and the user will name them.
- Self-measurement of the checkers (does checking help?). Correctly sequenced AFTER they
  have run for real, which they have not yet.
- 'Running the 13 unverified LLM phases. The largest unproven surface in the system: only
  root-organization/scan has completed through a live spawn.'
shared_constraints:
- 'Report rather than gate. Every checker here exits 0 with findings, with named exceptions
  recorded in the phase that needs them: diagram-citation-truth p0''s checker must exit
  non-zero, and document-citation-truth p2''s existence and range rules may hard-fail because
  all 12 checkable claims pass today. A check that fails closed on a false finding gets
  switched off, and a switched-off check catches nothing.'
- Report the checked/not-checkable split, never a bare total. document-citation-truth parses
  389 claims and can check 12. A checker reporting '389 checked' while examining 12 is a
  false all-clear -- the same shape as 9 wrong diagram citations behind a green gate, and
  as an exit code that cannot say how many diagrams it read.
- Prove both halves. A checker must be tested firing on a violation AND silent on a compliant
  shape. The second half is what stops it crying wolf -- a failure that actually happened
  is not the same as a rule that always fires.
- Verify before citing. Wrong line numbers shipped twice in one session, both into a delivered
  artifact. Resolve the line before publishing it; do not carry one forward from memory.
- Refuse to guess. An ambiguous resolution is reported as ambiguous. Picking one of sixteen
  __init__.py files produces a confident wrong answer.
- Markdown is for agents, HTML for humans, and the directory decides which. reports/ holds
  only what a human reads; machine handoffs go to reports/.handoff/ or .omp/theteam/reports/.
verification:
- command: python -m pytest -q
  expect: at least 800 passed, zero failures
- command: bash scripts/check_invariants.sh
  expect: invariant gate PASSED
- command: python3 -c "import yaml,glob;[yaml.safe_load(open(f)) for f in glob.glob('archive/tasks/*.yaml')]"
  expect: exit 0 -- every plan in this directory parses
evidence:
- artifact: reports/architecture-reality-analysis.html
  date: '2026-10-04'
  measures: 9 of 13 diagram citations wrong at authoring; 13/14 anchor hashes valid; 13/13
    edges real; 9 of 10 invariants enforced, rich nowhere; Layer 0 contract violated.
- artifact: archive/tasks/document-citation-truth.yaml
  date: '2026-10-04'
  measures: 389 path-shaped citations across 4 prose documents; 372 after 11 ignored and
    6 generated are dropped. Of those, 12 are line-cited and mechanically checkable, 26
    are package-relative (8 irreducibly ambiguous -- __init__.py matches 16 files), and
    334 are path-only with no line to verify. Two wrong ARCHITECTURE.md citations were published
    in this session and caught by hand. Measured by scripts/measure_citations.py, which
    imports the parser rather than retyping it.
phase_entry_points:
  human-report-surface: p2 -- move the 8 files. No decisions outstanding.
  diagram-citation-truth: p0-p1 -- the checker and the 9 corrections. Ships alone.
  document-citation-truth: p0 -- freeze the measurement. Its first run must reproduce 389/12;
    a mismatch means the parser drifted, not that the docs are wrong.
  system-awareness-injection: Start at p0 -- audit capability claims. Needs nothing external.
    p4 builds the rule-shape and its self-evaluating seed; no construction project is read
    at run time.
  project-convention-infra: BLOCKED at p0 only. p1, p2 and p3 do not need an example project.
