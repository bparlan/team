# Grafana datasource provisioning.
# This file is mounted read-only into the grafana container at
# /etc/grafana/provisioning/datasources/ (see docker-compose.prod.yml).

apiVersion: 1

datasources:
  - name: Prometheus
    uid: theteam-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    readOnly: false
    version: 1
    editable: true