# Diagram Citation Truth -- implementation plan
#
# Fifth plan in this directory, beside human-report-surface.yaml,
# project-convention-infra.yaml and system-awareness-injection.yaml. It lives
# here because AGENTS.md:39-40 bans `*_PLAN.md`, `*_ANALYSIS.md` and
# `*_REPORT.md`.
#
# The body is emitted by yaml.safe_dump from a dict, not hand-indented.
# Hand-written YAML failed to parse three times in one session -- an unquoted
# ": " inside a folded scalar is enough -- so only the prose in this header is
# hand-written.
#
# Status: not-started. Nothing in this plan has been implemented.
# Evidence: reports/architecture-reality-analysis.html (2026-10-04).
# Authored: 2026-10-04.

id: diagram-citation-truth
name: Diagram Citation Truth
status: not-started
status_meaning: 'Roadmap artifacts, not registered tasks, so this vocabulary is local to
  them and unrelated to theteam''s run statuses (ok / failed / skipped / awaiting). Legal
  values: not-started (ready to execute), awaiting-input (cannot begin without a user decision),
  blocked-on-defect (cannot begin until an external fix lands). Add any new value here first.'
problem: 'Nine of the thirteen source citations in diagrams/active-usage-architecture.json
  point at the wrong line, and they were never right. Thirteen of the fourteen cited files
  are byte-identical to their recorded sha256, so nothing moved: git show ca3673bf:theteam/cli.py
  puts build_parser at line 1203, and the diagram cites 604. This is an authoring defect,
  not staleness, and the existing gate cannot see it because it hashes whole files and asks
  whether a file changed, never whether a line holds the named symbol.'
distinction_that_decides_the_fix:
  authoring_defect: The cited file has not changed since the anchors were recorded, so the
    line number was wrong when written. Re-deriving does not fix it; correcting the number
    does.
  managed_staleness: 'The cited file changed, so a previously correct line moved. Exactly
    one case: the session node cites theteam/SKILL.md:117, which pointed at roster prose
    at ca3673bf and at the spawn-loop section now. This is the only case the current gate
    already reports.'
  why_it_matters: Treating both as staleness means re-deriving nine nodes that re-derive
    to the same wrong answer, and reporting the work as done.
corrections:
- node: theteam_cli
  file: theteam/cli.py
  wrong: 604
  right: 1203
  delta: 599
- node: agent_isolation
