<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>theteam — {title}</title>
<style>
  :root{
    --bg:#0f1115; --panel:#161a21; --line:#252b36; --fg:#dfe4ec; --dim:#8f9aab;
    --ok:#4ec9a0; --warn:#e0b341; --bad:#e5695f; --info:#6aa9e0; --accent:#b48ead;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f7f8fa; --panel:#fff; --line:#e2e6ec; --fg:#1b2029; --dim:#5c6779;
           --ok:#1a7f5a; --warn:#8a6100; --bad:#b0342a; --info:#1f5f9e; --accent:#7a4f86; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:15px/1.62 ui-sans-serif,-apple-system,"SF Pro Text",Segoe UI,Roboto,sans-serif}
  .wrap{max-width:1080px;margin:0 auto;padding:40px 24px 96px}
  h1{font-size:26px;margin:0 0 6px;letter-spacing:-.2px}
  h2{font-size:19px;margin:44px 0 12px;padding-top:14px;border-top:1px solid var(--line)}
  h3{font-size:15px;margin:22px 0 8px;color:var(--dim);text-transform:uppercase;letter-spacing:.09em}
  p,li{color:var(--fg)}
  .sub{color:var(--dim);margin:0 0 22px}
  code,kbd,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.87em}
  code{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:1px 5px}
  table{width:100%;border-collapse:collapse;margin:14px 0;font-size:13.5px}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--dim);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.08em}
  tbody tr:last-child td{border-bottom:none}
  .tag{display:inline-block;padding:1px 7px;border-radius:3px;font-size:11px;
       font-weight:600;letter-spacing:.04em;white-space:nowrap}
  .t-hold{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
  .t-drift{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
  .t-bad{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
  .t-info{background:color-mix(in srgb,var(--info) 18%,transparent);color:var(--info)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px 18px;margin:14px 0}
  .card.bad{border-left:3px solid var(--bad)}
  .card.warn{border-left:3px solid var(--warn)}
  .card.ok{border-left:3px solid var(--ok)}
  .card.info{border-left:3px solid var(--info)}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:18px 0}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
  .stat .n{font-size:24px;font-weight:650;line-height:1.2}
  .stat .l{color:var(--dim);font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;margin-top:3px}
  .n-ok{color:var(--ok)} .n-warn{color:var(--warn)} .n-bad{color:var(--bad)} .n-info{color:var(--info)}
  .why{color:var(--dim);font-size:13.5px;margin-top:8px;padding-left:12px;border-left:2px solid var(--line)}
  .why b{color:var(--fg);font-weight:600}
  .anchor{color:var(--info);text-decoration:none;border-bottom:1px dotted var(--info)}
  ol,ul{padding-left:22px} li{margin:5px 0}
  .meta{color:var(--dim);font-size:12.5px;margin-top:26px;padding-top:14px;border-top:1px solid var(--line)}
  details{margin:8px 0}
  summary{cursor:pointer;color:var(--info);font-size:13.5px}
</style>
</head>
<body>
<div class="wrap">
{content}
</div>
</body>
</html>
