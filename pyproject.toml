[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "theteam"
version = "1.0.0"
description = "Stability architecture for theteam: single unified loop, unified task contract, event-driven state"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
postgres = ["psycopg2-binary>=2.9.9"]

[project.scripts]
theteam = "theteam.__main__:main"

[tool.setuptools.packages.find]
include = ["theteam*"]
