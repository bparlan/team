phases:
- id: p0-baseline
  name: Freeze the evidence
  depends_on: []
  estimated_effort: 20 minutes, read-only
  rationale: Every number in this plan is already measured, but the measurement was
    taken in a session that no longer exists. Capture it where a fresh context can
    verify it before changing a single line, so the corrections are falsifiable rather
    than asserted.
  contract:
  - A checker names all 9 wrong citations by node, file and both line numbers.
  - Its finding count is reproducible from a clean checkout, and it exits non-zero
    when it finds any.
  - 'The checker is demonstrated in BOTH states before this phase closes: firing (names
    all 9 today) and silent (reports 0 and exits 0 once p1 lands). A checker only
    ever seen firing is not known to detect the passing case -- see shared_constraints,
    ''prove both halves''.'
  steps:
  - 'Add scripts/check_diagram_truth.py. Prefer a new file over extending check_prompt_truth.py:
    prompt truth and diagram truth are different failure modes and one exit code cannot
    report both honestly.'
  - Resolve each cited line to its named symbol with an AST walk over def/class nodes.
    Do not grep for the symbol name -- a name in a docstring would satisfy a grep,
    and six of the nine wrong citations point into a docstring or at line 1.
  - Confirm it reports exactly 9 findings, matching corrections[] in this file.
  - 'Demonstrate both states before closing: run it now and record the 9 findings,
    then run it against a corrected copy of the diagram in a scratch directory and
    record 0 with exit 0. Both runs go in the phase report. Proving only the firing
    half is how a checker passes vacuously.'
  done_when: The checker names all 9 by node, file and both line numbers today, reports
    0 with exit 0 against a corrected diagram, and its finding count is reproducible
    from a clean checkout.
  rollback: Delete the new script. No diagram or source file is touched in this phase.
  status: done
- id: p1-correct-citations
  name: Write the 9 correct line numbers into the diagram
  depends_on:
  - p0-baseline
  estimated_effort: 30 minutes
  rationale: 'This is the whole user-visible defect: a reader tracing any of 9 nodes
    today lands on the wrong line. It is mechanical, verified against git show ca3673bf,
    and independent of every other phase -- it can ship alone.'
  contract:
  - diagrams/active-usage-architecture.json cites the line of the named symbol for
    all 13 nodes.
  - The p0 checker reports zero findings afterwards.
  steps:
  - Apply corrections[] to diagrams/active-usage-architecture.json. Change only the
    line field; do not touch labels, ids, row, col or connections.
  - Do NOT re-derive the diagram. Re-deriving reproduces the same nine wrong numbers,
    because the generator resolves lines the same way it did when they were wrong.
  - Re-derive only the session node, whose file genuinely changed (SKILL.md:117).
  - Re-run the p0 checker. It must report 0 findings.
  done_when: Every symbol-bearing citation resolves to its symbol, and the session
    node points at the spawn-loop section rather than roster prose.
  rollback: git checkout diagrams/active-usage-architecture.json. The p0 checker then
    reports 9 again -- the honest pre-state, and proof the checker works rather than
    passing vacuously.
  status: done
- id: p2-enforce-in-the-gate
  name: Teach the anchor gate to resolve symbols
  depends_on:
  - p1-correct-citations
  estimated_effort: half a day
  rationale: Without this the nine come back. The mechanism already exists and runs
    -- it returned exit 3 and named SKILL.md correctly -- so this extends a working
    gate rather than building a new one.
  contract:
  - 'check() reports two distinct classes: a cited file changed (today''s behaviour),
    and a cited line does not hold its named symbol (new).'
  - It never reports the second class as the first. A changed file may still have
    correct lines.
  steps:
  - Add symbol resolution to check(), reusing the p0 resolver rather than reimplementing
    it.
  - Give the citation class a distinct exit code, so a caller can tell 're-derive
    this node' from 'fix this number'. Both stay non-zero; neither is a soft warning.
  - Do not weaken the hash check. It is correct, and it is what caught SKILL.md.
  done_when: Deliberately corrupting one citation makes the gate name that node; restoring
    it returns the gate to its current verdict.
  rollback: Revert the symbol-resolution block. The hash half is untouched and still
    catches SKILL.md.
  status: done
- id: p3-fix-gate-coverage
  name: Fix the gate's diagram coverage and its blind spot to itself
  depends_on:
  - p2-enforce-in-the-gate
  estimated_effort: half a day
  rationale: 'Two defects in the same loop, and the second is why the first went unnoticed.
    DIAGRAM_DIR.glob(''*.json'') at update_team_check.py:130 matches the sidecar itself,
    because ''active-usage-architecture.anchors.json'' also ends in .json. sorted()
    puts that sidecar at position 1; _sidecar_for() then looks for ''active-usage-architecture.anchors.anchors.json'',
    which does not exist, and :141 continues. Position 2 is the real diagram, its
    sidecar exists, the hashes are compared and it returns 3 -- verified by running
    it, which named theteam/SKILL.md. So the architecture diagram IS checked today;
    the defect is that check() returns at :176 after the first diagram that has a
    sidecar, and only one does, so the other two are never reached. Record a second
    sidecar and it is silently still never checked. The deeper problem is that the
    exit code is a single number: nothing in ''exit 3'' distinguishes ''I checked
    every diagram and one is stale'' from ''I stopped at the first one''. That is
    the same false-all-clear shape as the nine citations this gate waves through,
    one level up.'
  contract:
  - 'The loop iterates diagrams only: sidecars named *.anchors.json are excluded by
    construction, not by filename accident.'
  - Every diagram with a sidecar is checked in one run.
  - The exit code and report state how many diagrams were evaluated, so full coverage
    is distinguishable from early exit without reading the source.
  - Each verdict is reported separately; _report() stops overwriting one file with
    the next.
  steps:
  - Exclude sidecars from the glob -- iterate .json files whose name does not end
    in .anchors.json, so the loop sees diagrams and only diagrams. Verify the iteration
    count drops from 5 to 3 before anything else changes.
  - Accumulate per-diagram verdicts across the loop and return once, after it, so
    every diagram with a sidecar is evaluated in a single run.
  - Make the exit code and the report state how many diagrams were evaluated, so a
    caller reading only the exit code can tell full coverage from early exit. A gate
    whose coverage is invisible is the defect this plan exists to remove.
  - Give _report() a per-diagram filename, or write one report with a section per
    diagram, so a second diagram does not overwrite the first.
  - Decide explicitly whether milestones and llm-phase-spawn get sidecars. task-update-team.yaml's
    honest-coverage rule calls a diagram with no sidecar could-not-evaluate, never
    up to date; this phase should record them or make that rule executable rather
    than leaving it as prose in a task file.
  done_when: A run with two sidecars present evaluates both and names both verdicts,
    the evaluated count is visible in the report, and a sidecar present in diagrams/
    is never itself treated as a diagram.
  rollback: Revert to the single-diagram return. No recorded sidecar is affected,
    and the hash check that catches SKILL.md is untouched throughout.
  status: done
- id: p4-close-the-adjacent-gaps
  name: Fix the small findings the same measurement surfaced
  depends_on:
  - p3-fix-gate-coverage
  estimated_effort: half a day
  rationale: Each was measured in the same pass and each is a few lines. They are
    last because none misleads a reader tracing the architecture today, and bundling
    them earlier would make this plan's diff harder to review.
  contract:
  - Invariant 9 (no rich import) is enforced by scripts/check_invariants.sh.
  - theteam/__init__.py:30-33 describes the import graph as it is, not as it was.
  - theteam/skill/ and theteam/automation/ no longer exist on disk.
  steps:
  - Add the rich check to check_invariants.sh via check_call_sites.py, the same helper
    checks 2 and 6 already use. One line.
  - 'Correct the __init__.py comment: database.py imports postgres_cluster at point
    of use, so a bare import theteam loads database but not the cluster tier.'
  - rmdir theteam/skill/ and theteam/automation/. Both are empty and untracked, so
    no git diff will ever record that this was done -- which is also why nothing will
    catch it being undone.
  done_when: bash scripts/check_invariants.sh reports 8 checks and still exits 0;
    the comment matches a measured sys.modules; both directories are gone.
  rollback: The rich check is one line to remove. The comment reverts. The directories
    return empty, which is what they were.
  status: done
not_in_this_plan:
  layer_0_contract: ARCHITECTURE.md:459 says the entry layer must not know any domain
    object; cli.py references six. That is a design decision about how much wiring
    belongs in the CLI, not a defect with a known fix, and it deserves its own plan
    rather than a line in this one.
  milestone_pair_resync: 'ARCHITECTURE.md:11-24 documents it accurately: the JSON
    carries 11 nodes, the HTML renders 7, and archify validate fails on the committed
    source. The document says the blocker is the tool, not the content. Recorded,
    not planned -- and p3 makes the gate cover the pair once resynced.'
  event_bus_and_health_monitor: ARCHITECTURE.md records both as having no production
    importer and explicitly declines to decide whether to wire or delete them. That
    decision is not this plan's to make.
risks:
- - Re-deriving instead of correcting.
  - An archify re-run regenerates citations the same way and reproduces the nine wrong
    numbers. p1 forbids re-deriving except for the session node, and says so in its
    steps, because that is the failure this plan exists to prevent.
- - Making the gate noisier than the defect.
  - Symbol resolution will report findings on any commit that legitimately moves a
    line. That is correct and must be reported, not suppressed -- but it means p2
    turns a green gate red on today's tree. Sequence p1 before p2 so the tree is clean
    before the gate grows teeth.
- - Conflating the two classes again.
  - Nine authoring defects and one staleness case look identical from outside. p2's
    contract requires them reported distinctly; that requirement is the plan's main
    deliverable.
evidence:
  artifact: reports/architecture-reality-analysis.html
  date: '2026-10-04'
  commit: 02b8b76
  method: AST import scan (97 modules, 155 in-package edges), runtime sys.modules
    after `import theteam`, and symbol resolution of every cited file:line against
    the real def/class line at the anchor revision ca3673b and again at HEAD, so authoring
    defects separate from staleness.
  headline_numbers:
    citations_wrong_at_authoring: 9 of 13 symbol-bearing citations
    cited_files_unchanged_since_anchor_revision: 13 of 14
    diagram_edges_real: 13 of 13
    anchor_hashes_still_valid: '13 of 14 (gate names the 1 changed file: theteam/SKILL.md)'
    invariants_enforced_somewhere: 9 of 10; only `rich` (doc 9) is enforced nowhere
  reproduce:
  - 'python3 scripts/update_team_check.py  # exit 3, names theteam/SKILL.md'
  - 'git show ca3673bf:theteam/cli.py | grep -n ''^def build_parser''  # 1203, not
    the cited 604'
  - 'git diff --stat ca3673bf HEAD -- theteam/cli.py  # empty: the file never moved'
shared_constraints:
- - Report, never gate.
  - 'A phase reports what it found and exits 0; it does not fail a build because a
    citation is wrong. The p0 checker is the deliberate exception and says so in its
    own docstring: it is the only thing standing between nine wrong numbers and the
    next nine, and a checker nothing runs is indistinguishable from no checker. Every
    other finding in this plan is a report.'
- - Prove both halves.
  - 'The p0 checker must be demonstrated firing AND silent. Firing: it names all 9
    today. Silent: after p1, the same command reports 0 and still exits 0. A checker
    only ever observed in its failing state is not known to detect the passing one
    -- the failure mode this repo already has in check_task_contract.py and check_prompt_truth.py,
    which is why both were built to exit 0 with findings.'
- - Verify before citing.
  - Every correction in this file was resolved by AST against live source, and the
    plan is void if that stops being true. `git show ca3673bf:<file>` is the historical
    check; the AST walk is the current one. Never hand a line number forward without
    one of the two.
- - Cite the sibling plan, not the task file.
  - folder-monitoring.yaml shares this directory and nothing else -- different artifact
    class, different contract. Sibling plans are the precedent for this shape.
verification:
  today: 'python3 scripts/update_team_check.py exits 3 with ''re-derive may be needed''
    and names theteam/SKILL.md. That is correct: SKILL.md is the only cited file whose
    content changed. It is also exit 3 for the wrong reason -- the loop returns after
    the first diagram with a sidecar, and only one has one, so exit 3 today means
    ''one diagram checked'', not ''five diagrams checked, one stale''.'
  after_p1: The 9 citation lines are corrected. update_team_check.py still exits 3,
    still naming only SKILL.md, because correcting a line number in a file whose hash
    did not change moves no hash. Exit 3 across p1 is the expected state, not a regression.
  after_p2: The same command additionally resolves every cited line to its named symbol.
    Corrupting one citation makes it name that node with both line numbers; restoring
    it returns the previous verdict. This is the phase where a correct tree finally
    produces a meaningful exit code.
  after_p3: The loop iterates 3 diagrams instead of 5 (sidecars excluded by construction),
    the report states how many were evaluated, and a run with two sidecars present
    names both verdicts instead of overwriting one.
  after_p4: 'bash scripts/check_invariants.sh reports 8 checks and exits 0. The suite
    stays at 800 passed. `rmdir` leaves no git diff, which is the point: the two directories
    were untracked, so their absence is the only evidence the work happened.'
  suite_and_gates: 'python3 -m pytest -q -- expected: 800 passed, unchanged. This
    plan touches diagrams/, scripts/ and one comment; it must not alter product behaviour,
    so any test delta is a defect in the plan, not an expected cost.'
