name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The code targets 3.9+; 3.8 is dropped because the annotations and
        # typing usage in core modules require it.
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install pytest

    - name: Run all tests
      # Run the whole suite. Previously only 2 of the test files were invoked,
      # so most of the suite never gated a merge.
      run: python -m pytest -v

    - name: Verify package imports
      run: |
        python -c "import theteam"
        python -c "import theteam.core as c; assert c.MetricsCollector and c.BackupManager and c.AuditLogger"

    - name: Verify entry point
      run: python -m theteam --help || true
