id: root-organization
name: Root Folder Organization
type: maintenance
priority: 7
description: >-
  Keep the project root thin and agentic-friendly: an agent must be able to find
  where any file belongs without guessing. Audits root and subfolders to depth 3,
  classifies every entry, moves the high-confidence ones, and reports the rest as
  grouped questions. The decide phase argues the ask list from three named
  positions and consolidates them, so the human sees both answers side by side.

failure_handling: abort
expected_output: >-
  reports/root-organization.md — one section per root entry: classification
  (keep / move / delete / ask / skip), confidence, destination, reason. Grouped
  ask section. Plus reports/root-organization-decision.md with the three
  positions and where they agreed or split.
memory_limit_mb: 64

phases:
  - name: scan
    runner: llm
    member: scout
    prompt_file: prompts/root-organization-scan.md
    output: reports/root-organization-scan.md
    memory_limit_mb: 32
    order: 1

  - name: classify
    runner: llm
    member: architect
    prompt_file: prompts/root-organization-classify.md
    output: reports/root-organization-classify.md
    memory_limit_mb: 32
    order: 2

  - name: decide
    runner: llm
    member: skeptic
    prompt_file: prompts/root-organization-decide.md
    output: reports/root-organization-decision.md
    memory_limit_mb: 32
    order: 3

  - name: report
    runner: llm
    member: pragmatist
    prompt_file: prompts/root-organization-report.md
    output: reports/root-organization.md
    order: 4

coverage:
  - root depth 1 (files and directories)
  - depth 2 subfolders
  - depth 3, scoped to python-project/, bash-project/, typescript-project/
    and their examples/ counterparts
  - tracked files only, via git ls-files
  - runtime artifacts identified by content, not by name

definition_of_done:
  - every root entry classified as keep / move / delete / ask / skip
  - every high-confidence move executed and verified at destination
  - every high-confidence delete executed and verified recoverable via git
  - every ask item is a grouped question, not a decision made by the agent
  - the decision record carries three positions per ask item
  - git status clean, or only ask-list items uncommitted
  - no untracked file deleted without explicit human approval
  - learnings written back so the next run is better

termination:
  - stop when every root entry is classified and every ask item is open
  - a second pass over the same root is expected if new entries appear
  - a third pass is a signal to widen scope, not to keep re-scanning
  - never delete an untracked file; always a human decision

gates: >-
  move: high when the destination is unambiguous and no counterpart exists
  there; ask when the entry is a duplicate or two destinations fit.
  delete_tracked: allowed at high confidence, git restore undoes it.
  delete_untracked: never, there is no safety net, always an ask item.
  recyclebin: git for tracked files, no folder needed. Untracked files only to
  .loop-archive/ (out of root) with human approval. Never at root, because a
  recycle bin at root is itself the clutter we are fixing.

rules:
  - scan and classify phases are read-only — no edits, moves, or deletions
  - decide phase argues each ask item from three named positions in one voice,
    and records disagreement rather than inventing consensus
  - a phase runs one subagent, so three positions are written by one author —
    say so in the report, or the human will read one voice as three
  - report phase writes the report and consolidated ask only
  - moves and tracked deletions happen after the human answers the ask list
  - runtime state (wal.json, *.db, *.jsonl, *_report.json) stays untracked and
    is never re-tracked after relocation
  - archive/ and theteam/ trees are out of scope unless the human widens it
  - the three duplicate projects are in scope at depth 3 because they duplicate
    examples/ and are candidate leftovers
  - self-improvement — record what was uncertain, what was decided, and what
    the next run should check differently