id: system-awareness
name: System Awareness
type: analysis
priority: 7
description: 'Run comprehensive system architecture analysis (4-phase: structure,
  documentation, architecture, infrastructure) with health scoring and team commentary'
failure_handling: skip
context:
- Project structure and module organization
- Documentation quality and completeness
- Architecture patterns and technical debt
- Infrastructure build systems and configs
expected_output: 'System awareness analysis complete: grade A-F, score 0.00-1.00/1.00'
phases:
  # `args` was empty, so this ran `sa_runner.py` bare. With no subcommand it
  # falls through every branch in `main()` to `parser.print_help()` and exits 0
  # — the task reported success while running no analysis at all. That is the
  # §3.3 failure: a result that looks like a measurement and is not one.
  #
  # `self-correct` is the subcommand that does the work: it runs the 4-phase
  # analysis, writes all five reports, and refreshes `.loop-state.json`, which
  # is what keeps `project-integrity` and `health-check` reading real values
  # rather than a month-old cache. `health-check` would be wrong here — it only
  # reads state, so the task would again pass without analysing anything.
  - name: analyse and correct
    script: scripts/sa_runner.py
    args: ["self-correct"]
    # Was 300, which this phase cannot finish in. Measured: 117s bare on the
    # host, ~360s through the executor's container (single CPU, pids-limit 256,
    # read-only rootfs) — the same analysis, slower because it is bounded. The
    # 300s ceiling therefore killed it every time, and the five OOM-kills the
    # breaker remembers were this same phase before the memory bound was fixed.
    #
    # 600 is the measured cost rounded up to a bound a human would not have to
    # think about. Raise it only with a new measurement: a bare `python3
    # scripts/sa_runner.py self-correct` under ~120s says nothing about the
    # container, which is where this actually runs.
    timeout_seconds: 600
    # Was 64, which this phase cannot run in: OOM-killed at exit 137 on
    # every run. Measured floor through the executor, by exit code:
    # 256->137, 320->137, 384->0, 512->0.
    #
    # 384 is not a round number picked for headroom. It is the lowest bound
    # measured to survive the executor, and the executor is what runs this.
    # It moved 320->384 when `format_consistency` stopped being the literal
    # 0.8 and became a real scan of all 181 markdown files -- a derived
    # measurement costs more memory than the constant it replaced.
    # A bare `docker run --memory=256m` succeeds where the executor is
    # killed at 256, so the floor has to be measured through the executor.
    #
    # When it outgrows 384, the analysis needs splitting into more phases -- a
    # bigger number here would hide that one process is doing four jobs.
    memory_limit_mb: 384
    # This phase writes 5 reports and refreshes `.loop-state.json`, and the
    # executor mounts the project read-only by default. Without this flag the
    # writes fail inside the container and the phase still exits 0 — observed:
    # `system-awareness: ok`, zero reports written, `.loop-state.json` stale.
    # That is a success that did no work, which is the defect this repo exists
    # to prevent. Same flag, same reason as `maintenance`.
    writable_project: true
order: 2
