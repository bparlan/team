id: project-integrity
name: Project Integrity Check
type: monitoring
priority: 10
description: >-
  Verifies the project is intact: required directories, required configs,
  required scripts, required tools, Python version, and that the loop state
  exists and parses.
failure_handling: retry
expected_output: 'Project integrity check passed: all systems operational'
phases:
  # Two phases, and they must stay two. The *directory* checks overlap — the
  # infrastructure check's REQUIRED_DIRS is a superset of the health check's,
  # and both read `.loop-state.json`, so a single merged phase would report the
  # same missing directory twice.
  #
  # But the overlap is not total, and that is the reason not to collapse these:
  # `loop_infrastructure_check.py` has no `check_required_configs` at all.
  # Config existence and JSON-parse validation exist only in
  # `loop_health_check.py` (`REQUIRED_CONFIGS`, lines 43-56). Dedupe on the
  # directory observation alone and config validation silently disappears,
  # leaving a task that passes on a project with an unparseable
  # `theteam.config`.
  - name: directories configs and loop state
    script: scripts/loop_health_check.py
    args: []
    timeout_seconds: 300
    memory_limit_mb: 64
  - name: scripts tools and layout
    script: scripts/loop_infrastructure_check.py
    args: []
    timeout_seconds: 300
    memory_limit_mb: 64
order: 0