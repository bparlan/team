id: update-team
name: Update team artifacts
type: maintenance
priority: 5
description: >-
  The post-implementation sequence. Runs the mechanical half — the staleness
  gate over the files each diagram cites — and names the rest, because most of
  it needs a session or a host.

  Step 0 (this task): is anything necessary? Steps 1–4 stay manual — see
  `expected_output` for why each is out of scope.

  The gate hashes cited files instead of diffing git, because the phase image
  has no git binary. Measured: `docker run --rm theteam:p4final sh -c "which
  git"` prints NO-GIT-BINARY, so a git-based gate exits CANNOT_EVALUATE every
  run, which the executor scores as a failure — five breaker trips, then the
  task never runs again.
failure_handling: retry
expected_output: >-
  .omp/theteam/reports/update-team.md — pinned revision vs HEAD, the cited
  cited files that changed since the diagram was derived, and the next
  action. Exit 0 = nothing necessary, 3 = findings (a cited file changed),
  2 = cannot evaluate (no anchor sidecar, or a cited file is gone).
  4 = a cited line does not hold its named symbol — fix the number, do not
  re-derive. Every diagram with a sidecar is evaluated in one run, and the
  report states how many, so full coverage is distinguishable from an early
  exit without reading this file.
  Also writes .omp/theteam/reports/update-team-<diagram>.md per diagram, so a
  second verdict cannot overwrite the first.

  Why steps 1–4 are not in this task:
  * archify lives at ~/.omp/agent/skills/archify, outside the project mount,
    so a `script:` phase cannot reach it.
  * the production skill lives at ~/.omp/agent/skills/theteam, likewise.
    `python3 scripts/export_skill.py` is the one action in this sequence with
    real blast radius, and it must stay host-side.
  * editing existing files has no output signal for the llm completion rule,
    so steps 2 and 3 cannot be llm phases either.

  Manual follow-up, in order:
  1. archify validate + deliver for any node whose cited path moved
  2. docs — prose has no mechanical truth test
  3. command guide — the short tables in SKILL.md and README.md
  4. python3 scripts/export_skill.py — the gate. Runs the suite and installs
     only if it passes. No arguments. Must be last: it rewrites repo paths to
     absolute on the way in.
gates: >-
  scope: step 0 only. Nothing else is automatable from inside a container.
  mtime: never. staleness is a content hash per cited file; a rebase or
  checkout moves mtimes without changing content.
  no-git: the phase image has no git binary, so the gate hashes instead of
  diffing. The derived state lives beside each diagram, as
  diagrams/<name>.anchors.json,
  written by `python3 scripts/update_team_check.py --record` on the host.
  scope-is-trigger: the gate names files that changed, not files that are
  wrong. Re-deriving a node that did not need it is the safe failure mode.
  honest-coverage: only active-usage-architecture.json carries source anchors.
  llm-phase-spawn and active-usage-milestones have none and stay
  judgment-only. That asymmetry is reported, never smoothed over.
  no-anchors: a diagram with no sidecar has no mechanical staleness test.
  Reported as could-not-evaluate, never as up to date.
rules:
  - the staleness gate is a trigger, not a verdict
  - re-record the sidecar only after the diagram itself is re-derived
  - do not register export-skill as a task, because it cannot reach the
    production directory from inside a container
  - do not run archify from inside a task, because it is not in the project
    mount
memory_limit_mb: 64
phases:
  - name: check
    script: scripts/update_team_check.py
    args: []
    timeout_seconds: 120
    memory_limit_mb: 64
    writable_project: true
order: 10
