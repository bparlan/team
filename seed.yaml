schema_version: '1.0'
directory_shape:
  required:
  - docs
  - scripts
  - src
  - tests
  optional:
  - data
  convention: 'Required directories exist in every project. Optional ones are created
    only when the project needs them. The shape is portable: no project-specific paths
    are recorded.'
  capabilities:
    docs/skeletons/: 'Not created by the seed. Generated by the `code-search` skill
      (run from the project root: `code-search --skeletons`). It is a capability,
      not a directory — seeding an empty skeletons/ would create a directory for a
      skill that may not be present, which is the defect the evolution floor exists
      to prevent.'
rule_template:
  name: Core convention requirement
  contract:
  - Every project must have AGENTS.md defining conventions.
  - Every project must have README.md for documentation.
  - Every project must have docs/, scripts/, src/ and tests/.
  evidence: verified
  rule_correct: kept
  falsification_test:
    command: test -f AGENTS.md && test -f README.md && test -d docs && test -d scripts
      && test -d src && test -d tests
    expected: All required files and directories exist
evolution_floor:
  can_add_rules: true
  can_modify: true
  can_delete: false
  requires_human_approval: true
