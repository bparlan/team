id: doc-harmonization
name: Doc Harmonization
type: analysis
priority: 8
description: >-
  Consumes the ground-truth audit and makes the smallest set of document
  edits that makes the documentation true. Skips every finding the audit
  could not verify; passes no guess into a document.
failure_handling: retry
expected_output: >-
  Edited documents, each finding recorded with the text it replaced and why
  the replacement is enough.
phases:
  - name: harmonize
    runner: llm
    member: pragmatist
    prompt_file: prompts/doc-harmonization.md
    output: .omp/theteam/reports/doc-harmonization.md
    memory_limit_mb: 64
order: 6
